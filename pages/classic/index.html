<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="themeColorMeta" content="#dce9f7">
  <title>اشتراک کلاسیک</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (Play CDN): the classic panels are utility-first -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            text1: "var(--text)",
            muted1: "var(--muted)",
            accent1: "var(--accent)",
            accent12: "var(--accent-2)",
            edge1: "var(--edge)",
            hi1: "var(--hi)",
            card1: "var(--card)",
            good1: "var(--good)",
            bad1: "var(--bad)",
            bg12: "var(--bg-2)"
          },
          fontFamily: { sans: ["Vazirmatn", "Inter", "sans-serif"] }
        }
      }
    };
  </script>

  <!-- ============================================================
       Custom CSS: classic theme tokens + the pieces Tailwind cannot
       express (the 3D hard-shadow buttons, the sweeping wave, the
       coin logo). Everything else is utilities / @apply components.
       ============================================================ -->
  <style>
    :root {
      --bg: #0a0705;
      --bg-2: #140e0a;
      --card: #16100c;
      --text: #e8d4c4;
      --muted: #9a7a62;
      --accent: #6a3e1c;
      --accent-2: #8a5228;
      --edge: #2a1a12;
      --hi: #1c120c;
      --good: #3cb371;
      --bad: #e23d3d;
      --shadow: 10px 12px 0 #050302, 0 18px 36px rgba(0,0,0,.75);
      --inset: inset 0 2px 0 rgba(255,220,180,.08), inset 0 -4px 8px rgba(0,0,0,.55);
      --wave: rgba(90,55,28,.28);
      --font: "Vazirmatn", "Inter", sans-serif;
    }
    html.day-mode, body.day-mode {
      --bg: #dce9f7;
      --bg-2: #c9dcf0;
      --card: #eef5fc;
      --text: #16324f;
      --muted: #4a6d8c;
      --accent: #2f6fad;
      --accent-2: #4a8fd4;
      --edge: #7aa3c7;
      --hi: #ffffff;
      --good: #1f9d5a;
      --bad: #d12626;
      --shadow: 8px 10px 0 #8fb0d0, 0 16px 28px rgba(47,111,173,.22);
      --inset: inset 0 2px 0 #fff, inset 0 -4px 8px rgba(47,111,173,.18);
      --wave: rgba(47,111,173,.18);
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; margin: 0; padding: 0; }
    body { padding: 1rem; overflow-x: hidden; transition: background .4s, color .4s; }
    body.lang-en { font-family: Inter, Vazirmatn, sans-serif; }

    /* diagonal wave sweeping from the top-left corner */
    .wave { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .wave::before {
      content: "";
      position: absolute; width: 180%; height: 80px;
      top: -40px; left: -40%;
      background: linear-gradient(115deg, transparent 0%, var(--wave) 40%, transparent 70%);
      transform: rotate(28deg);
      animation: waveSweep 7s linear infinite;
    }
    @keyframes waveSweep {
      0% { transform: rotate(28deg) translate(-20%, -40%); }
      100% { transform: rotate(28deg) translate(40%, 220%); }
    }
    @keyframes pulse { 50% { opacity: .55; } }
    @keyframes coin-spin {
      0%, 100% { transform: rotateX(0deg) rotateY(0deg) scale(1); }
      25% { transform: rotateX(8deg) rotateY(90deg) scale(1.04); }
      50% { transform: rotateX(0deg) rotateY(180deg) scale(1); }
      75% { transform: rotateX(-8deg) rotateY(270deg) scale(1.04); }
    }
    @keyframes coin-shine {
      0%, 100% { opacity: .72; transform: translateZ(9px) rotate(0deg); }
      50% { opacity: .34; transform: translateZ(9px) rotate(18deg); }
    }
    @media (prefers-reduced-motion: reduce) { .coin-logo, .coin-logo::after, .wave::before { animation: none; } }

    /* ---------- spinning coin logo ---------- */
    .coin-logo {
      position: relative;
      flex: 0 0 60px; width: 60px; height: 60px;
      border-radius: 50%;
      perspective: 160px; transform-style: preserve-3d; isolation: isolate;
      will-change: transform;
      animation: coin-spin 12s ease-in-out infinite;
      filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .28));
      border: 2px solid var(--accent-2);
      box-shadow: 0 6px 0 var(--edge), 0 0 18px color-mix(in srgb, var(--accent-2) 40%, transparent);
    }
    .coin-face {
      position: absolute; inset: 0; border-radius: 50%;
      background: url("https://s33.picofile.com/file/8483706450/jalaliiiii.jpg") center / cover no-repeat;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .coin-face.front { transform: translateZ(4px); }
    .coin-face.back { transform: rotateY(180deg) translateZ(4px); }
    .coin-logo::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: linear-gradient(120deg, rgba(255,255,255,.48), transparent 30%, transparent 58%, rgba(255,255,255,.08));
      transform: translateZ(9px);
      animation: coin-shine 12s ease-in-out infinite;
      pointer-events: none; z-index: 1;
    }
    @media (max-width: 600px) { .coin-logo { flex-basis: 48px; width: 48px; height: 48px; } }

    /* the tab menu: five columns on desktops, two equal columns on phones with
       the last tab spanning the width */
    .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; }
    @media (max-width: 620px) {
      .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tab { font-size: .78rem; }
      .tab:last-child { grid-column: 1 / -1; }
    }
    /* the visible panel takes every pixel the menu left over */
    .panels { display: flex; flex-direction: column; flex: 1 1 auto; }
    .panel { display: none; }
    .panel.on { display: flex; flex: 1 1 auto; flex-direction: column; justify-content: center; min-height: 11rem; }
  </style>

  <!-- Component classes: Tailwind's @apply. The script rewrites some of these
       elements' class names wholesale (`pill ok`, `lead-os`, `panel on`), so each
       one has to carry its full look on its own. -->
  <style type="text/tailwindcss">
    @layer components {
      .wrap { @apply relative z-[1] mx-auto flex min-h-[calc(100dvh-2rem)] max-w-[920px] flex-col; }

      .card3d {
        @apply mb-[0.9rem] rounded-[18px] border-2 border-edge1 px-4 py-[0.9rem];
        background: linear-gradient(180deg, var(--hi), var(--card));
        box-shadow: var(--shadow), var(--inset);
      }
      .top-row { @apply relative flex flex-nowrap items-center justify-between gap-[0.8rem]; }
      .top-btns { @apply flex flex-shrink-0 gap-[0.45rem]; }

      .btn3d {
        @apply inline-flex cursor-pointer items-center justify-center gap-1 rounded-xl border-2 border-edge1 px-[0.7rem] py-[0.4rem] font-bold text-text1;
        background: linear-gradient(180deg, var(--hi) 0%, var(--card) 55%, color-mix(in srgb, var(--edge) 35%, var(--card)) 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -5px 10px rgba(0,0,0,.28), 0 3px 0 var(--edge), 5px 8px 0 color-mix(in srgb, var(--edge) 85%, #000), 8px 14px 18px rgba(0,0,0,.38);
        transform: translateY(-3px);
        transition: transform .12s, box-shadow .12s;
      }
      .btn3d:hover { @apply -translate-y-[5px]; box-shadow: inset 0 2px 0 rgba(255,255,255,.32), inset 0 -5px 10px rgba(0,0,0,.28), 0 3px 0 var(--edge), 7px 11px 0 color-mix(in srgb, var(--edge) 85%, #000), 10px 18px 22px rgba(0,0,0,.42); }
      .btn3d:active { @apply translate-y-[2px]; box-shadow: inset 0 4px 8px rgba(0,0,0,.35), 1px 2px 0 var(--edge), 2px 3px 6px rgba(0,0,0,.3); }
      .btn3d.active { @apply outline outline-2 outline-accent12; }

      .user-row { @apply flex flex-wrap items-center justify-between gap-[0.6rem]; }
      .user-name { @apply text-[1.05rem] font-extrabold; }
      .pills { @apply flex flex-wrap gap-[0.4rem]; }
      .pill {
        @apply inline-block rounded-full border-2 border-edge1 px-[0.6rem] py-[0.15rem] text-[0.78rem] font-bold text-text1;
        background: var(--card);
        box-shadow: 3px 4px 0 var(--edge);
      }
      .pill.ok { background: color-mix(in srgb, var(--good) 22%, var(--card)); }
      .pill.bad { background: color-mix(in srgb, var(--bad) 22%, var(--card)); }
      .pill .dot { @apply me-1 inline-block h-2 w-2 rounded-full; }
      .pill.online .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
      .pill.offline .dot { background: var(--bad); }

      .clock-box { @apply text-center; }
      .clock-time { @apply text-[1.7rem] font-extrabold tracking-[0.04em]; }
      .clock-date { @apply mt-[0.15rem] text-muted1; }
      .clock-event { @apply mt-[0.35rem] font-bold text-accent12; }
      .clock-event[hidden] { @apply hidden; }

      .alert-box {
        @apply hidden rounded-[14px] border-2 border-dashed border-bad1 p-[0.8rem] text-center font-extrabold text-bad1;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .alert-box.show { @apply block; }

      .tabs { @apply mb-[0.9rem] grid gap-[0.6rem]; }
      /* one tidy set of shadows so a tab never spills over its neighbour */
      .tab {
        @apply min-h-[46px] px-[0.45rem] py-[0.4rem] text-center text-[0.82rem] leading-[1.25];
        transform: none;
        box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -4px 8px rgba(0,0,0,.22), 0 3px 0 var(--edge), 3px 5px 0 color-mix(in srgb, var(--edge) 80%, #000);
      }
      .tab:hover { @apply -translate-y-0.5; box-shadow: inset 0 2px 0 rgba(255,255,255,.34), inset 0 -4px 8px rgba(0,0,0,.22), 0 3px 0 var(--edge), 5px 8px 0 color-mix(in srgb, var(--edge) 80%, #000); }
      .tab:active { @apply translate-y-px; box-shadow: inset 0 4px 8px rgba(0,0,0,.35), 1px 2px 0 var(--edge); }
      .tab.on { color: #fff; background: linear-gradient(180deg, var(--accent-2), var(--accent)); }

      .bar-track { @apply h-[22px] overflow-hidden rounded-full border-2 border-edge1; background: var(--bg-2); box-shadow: inset 0 4px 8px rgba(0,0,0,.25); }
      .bar-fill { @apply h-full w-0 rounded-[inherit]; transition: width .5s ease; }
      .bar-meta { @apply my-[0.35rem] flex justify-between font-bold; }
      .expire { @apply mt-[0.7rem] text-muted1; }
      .blink-big { @apply mt-[0.8rem] text-center text-[1.8rem] font-black text-bad1; animation: pulse .9s ease-in-out infinite; }

      .stat-grid { @apply grid gap-2; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
      .stat { @apply rounded-xl border-2 border-edge1 p-[0.6rem]; background: var(--card); box-shadow: 4px 5px 0 var(--edge); }
      .stat b { @apply mt-[0.2rem] block text-[1.05rem]; }

      .row-line { @apply mb-[0.55rem] flex items-center gap-[0.4rem]; }
      .link-text {
        @apply min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap rounded-[10px] border-2 border-edge1 px-2 py-[0.4rem] text-[0.78rem];
        background: var(--bg-2); direction: ltr; text-align: left;
      }
      .cfg-list { @apply flex flex-col gap-[0.45rem]; }
      .cfg-item .row-line { @apply mb-0; }
      .sep-line { @apply my-3 h-0 border-0 border-t-2 border-dashed border-edge1; }
      .sec-title { @apply mb-[0.55rem] font-extrabold; }
      .copy-all-row { @apply mb-[0.55rem] flex justify-start; }

      .qr-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.86); display: none; align-items: center; justify-content: center; cursor: pointer; }
      .qr-overlay.open { display: flex; }
      .qr-overlay img { width: min(86vw, 86vh); height: min(86vw, 86vh); box-sizing: border-box; padding: 2.2rem; background: #fff; object-fit: contain; border-radius: 16px; }

      .apps-grid { @apply grid gap-[0.55rem]; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .app-card { @apply p-[0.6rem] text-center; }
      .app-card img { @apply h-12 w-12 rounded-xl; }
      .app-name { @apply my-[0.35rem] block text-[0.8rem] font-bold; }
      .os-row { @apply mb-[0.7rem] flex flex-wrap items-center gap-2; }
      .lead-os {
        @apply ms-[0.4rem] inline-block rounded-full border-2 border-edge1 px-2 py-[0.05rem] text-[0.72rem] font-bold;
        background: var(--card);
        box-shadow: 2px 3px 0 var(--edge);
      }
      .lead-os[hidden] { @apply hidden; }
      select.os { @apply rounded-[10px] border-2 border-edge1 px-2 py-[0.35rem] font-bold text-text1; background: var(--card); font-family: inherit; }
    }
  </style>
</head>
<body>
  <div class="wave" aria-hidden="true"></div>
  <div class="wrap">
    <div class="card3d top-row">
      <div class="top-btns">
        <button class="btn3d" id="themeToggle" type="button" onclick="toggleTheme()">
          <span id="themeIcon">🌙</span> <span data-i18n="nightMode">شب</span>
        </button>
        <button class="btn3d" id="langToggle" type="button" onclick="toggleLang()">
          🌐 <span id="langLabel">EN</span>
        </button>
      </div>
      <span class="coin-logo" aria-hidden="true">
        <span class="coin-face front"></span>
        <span class="coin-face back"></span>
      </span>
    </div>

    <div class="card3d user-row">
      <div class="user-name">👤 {{ index .emails 0 }}</div>
      <div class="pills">
        <span id="statusBadge" class="pill">—</span>
        <span id="presence" class="pill offline"><i class="dot"></i><span id="presenceText">آفلاین</span></span>
      </div>
    </div>

    <div class="card3d clock-box" id="clockCard">
      <div class="clock-time" id="clockTime">🕐 —</div>
      <div class="clock-date" id="clockDate">📅 —</div>
      <div class="clock-event" id="clockEvent" hidden></div>
    </div>
    <div class="card3d alert-box" id="alertBox"></div>

    <div class="tabs" role="tablist">
      <button class="btn3d tab on" type="button" id="tab-time" role="tab" aria-selected="true" aria-controls="panel-time" data-tab="time" onclick="showTab('time')"><span data-i18n="tabTime">⏳ زمان باقیمانده</span></button>
      <button class="btn3d tab" type="button" id="tab-usage" role="tab" aria-selected="false" aria-controls="panel-usage" data-tab="usage" onclick="showTab('usage')"><span data-i18n="tabUsage">📊 جزییات مصرف</span></button>
      <button class="btn3d tab" type="button" id="tab-chart" role="tab" aria-selected="false" aria-controls="panel-chart" data-tab="chart" onclick="showTab('chart')"><span data-i18n="tabChart">📈 نمودار مصرف</span></button>
      <button class="btn3d tab" type="button" id="tab-links" role="tab" aria-selected="false" aria-controls="panel-links" data-tab="links" onclick="showTab('links')"><span data-i18n="tabLinks">🔗 لینک ساب و کانفیگ‌ها</span></button>
      <button class="btn3d tab" type="button" id="tab-apps" role="tab" aria-selected="false" aria-controls="panel-apps" data-tab="apps" onclick="showTab('apps')"><span data-i18n="tabApps">📱 نصب و راه اندازی</span></button>
    </div>

    <div class="panels">
    <section class="card3d panel on" id="panel-time" role="tabpanel" aria-labelledby="tab-time">
      <div class="bar-meta">
        <span data-i18n="remainTime">⏳ زمان باقی‌مانده</span>
        <span id="timePct">—</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="timeBar"></div></div>
      <div class="expire"><span data-i18n="expireDate">📆 تاریخ انقضا:</span> <strong id="expireDateText">—</strong></div>
      <div id="timeRemainLabel" class="mt-2 font-extrabold"></div>
    </section>

    <section class="card3d panel" id="panel-usage" role="tabpanel" aria-labelledby="tab-usage">
      <div class="stat-grid">
        <div class="stat"><span data-i18n="totalQuota">📦 حجم کل</span><b id="valTotal">—</b></div>
        <div class="stat"><span data-i18n="used">📉 مصرف‌شده</span><b id="valUsed">—</b></div>
        <div class="stat"><span data-i18n="remained">📈 باقی‌مانده</span><b id="valRemained">—</b></div>
        <div class="stat"><span data-i18n="downloadLbl">⬇️ دانلود</span><b id="valDown">—</b></div>
        <div class="stat"><span data-i18n="uploadLbl">⬆️ آپلود</span><b id="valUp">—</b></div>
      </div>
    </section>

    <section class="card3d panel" id="panel-chart" role="tabpanel" aria-labelledby="tab-chart">
      <div class="bar-meta">
        <span data-i18n="remainTraffic">📶 ترافیک باقی‌مانده</span>
        <span id="usagePct">—</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="usageBar"></div></div>
      <div class="blink-big" id="remainBlink">—</div>
    </section>

    <section class="card3d panel" id="panel-links" role="tabpanel" aria-labelledby="tab-links">
      <div class="sec-title" data-i18n="subLinkTitle">🔗 لینک سابسکریپشن</div>
      <div class="row-line">
        <div class="link-text" id="subLinkDisplay">{{ .subUrl }}</div>
        <button class="btn3d" type="button" data-copy="{{ .subUrl }}" onclick="copyFromButton(this)"><span data-i18n="copy">📋 کپی</span></button>
        <button class="btn3d" type="button" data-copy="{{ .subUrl }}" onclick="openQR(this.dataset.copy)">▦ QR</button>
      </div>
      <hr class="sep-line">
      <div class="sec-title" data-i18n="configsTitle">🧩 کانفیگ‌ها</div>
      <div class="copy-all-row">
        <button class="btn3d" type="button" onclick="copyAllConfigs(this)"><span data-i18n="copyAll">📋 کپی همه</span></button>
      </div>
      <div class="cfg-list">
        {{ range $index, $link := .links }}
        <div class="cfg-item card3d m-0 p-[0.55rem]" data-link="{{ $link }}">
          <div class="row-line">
            <div class="link-text">{{ $link }}</div>
            <button class="btn3d" type="button" data-copy="{{ $link }}" onclick="copyFromButton(this)"><span data-i18n="copy">📋 کپی</span></button>
            <button class="btn3d" type="button" onclick="toggleConfigQR(this)">▦ QR</button>
          </div>
        </div>
        {{ end }}
      </div>
    </section>

    <section class="card3d panel" id="panel-apps" role="tabpanel" aria-labelledby="tab-apps">
      <div class="os-row">
        <span id="osLabel" data-i18n="selectOS">💻 سیستم عامل:</span>
        <select class="os" id="osSelect" aria-labelledby="osLabel" onchange="setPlatformTab(this.value)">
          <option value="android" data-platform="android">🤖 Android</option>
          <option value="ios" data-platform="ios">🍎 iOS</option>
          <option value="windows" data-platform="windows">🪟 Windows</option>
        </select>
        <span id="osChip" hidden></span>
      </div>
      <div id="appsLead" class="mb-[0.6rem] text-muted1"></div>
      <div class="apps-grid" id="appsGrid"></div>
    </section>
    </div>
  </div>

  <div class="qr-overlay" id="qrModal" onclick="this.classList.remove('open')">
    <img id="qrImg" alt="QR">
  </div>

<script>
    const I18N = {
      fa: {
        dir: "rtl", title: "اشتراک کلاسیک",
        nightMode: "شب", dayMode: "روز",
        active: "✅ فعال", inactive: "⛔ غیرفعال", pending: "⏳ در انتظار",
        online: "🟢 آنلاین", offline: "🔴 آفلاین",
        tabTime: "⏳ زمان باقیمانده", tabUsage: "📊 جزییات مصرف", tabChart: "📈 نمودار مصرف",
        tabLinks: "🔗 لینک ساب و کانفیگها", tabApps: "📱 نصب و راه اندازی",
        remainTime: "⏳ زمان باقی‌مانده", remainTraffic: "📶 ترافیک باقی‌مانده",
        expireDate: "📆 تاریخ انقضا:", totalQuota: "📦 حجم کل", used: "📉 مصرف‌شده", remained: "📈 باقی‌مانده",
        downloadLbl: "⬇️ دانلود", uploadLbl: "⬆️ آپلود", copy: "📋 کپی", copyAll: "📋 کپی همه", download: "⬇️ دانلود",
        selectOS: "💻 سیستم عامل:", tehranTime: "وقت تهران",
        subLinkTitle: "🔗 لینک سابسکریپشن", configsTitle: "🧩 کانفیگ‌ها",
        alertVol: "ترافیک باقیمانده شما کمتر از یک گیگ میباشد لطفا جهت تمدید سرویس خود اقدام فرمایید .",
        alertTime: "زمان باقیمانده شما کمتر از یک روز میباشد لطفا جهت تمدید سرویس خود اقدام فرمایید",
        days: "روز", hours: "ساعت",
        androidName: "اندروید", iosName: "آیفون", windowsName: "ویندوز",
        androidIcon: "🤖", iosIcon: "🍎", windowsIcon: "🪟",
        downloadBtn: "⬇️ دانلود", detectedHint: "✨ تشخیص داده شد",
        leadDetected: "📱 برنامه‌های مناسب دستگاه شما", leadChosen: "📂 برنامه‌های سیستم‌عامل انتخابی", leadUnknown: "💻 سیستم‌عامل را انتخاب کنید",
        noSubLink: "❌ لینک یافت نشد"
      },
      en: {
        dir: "ltr", title: "Classic subscription",
        nightMode: "Night", dayMode: "Day",
        active: "✅ Active", inactive: "⛔ Inactive", pending: "⏳ Pending",
        online: "🟢 Online", offline: "🔴 Offline",

    function toJalali(gy, gm, gd) {
      const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
      let jy = gy <= 1600 ? 0 : 979;
      gy -= gy <= 1600 ? 621 : 1600;
      const gy2 = gm > 2 ? gy + 1 : gy;
      let days = 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) +
                 Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
      jy += 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      jy += Math.floor((days - 1) / 365);
      days = (days - 1) % 365;
      const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
      const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
      return [jy, jm, jd];
    }

    function mixColor(p) {
      const g = [60, 179, 113], r = [226, 61, 61];
      const t = 1 - Math.max(0, Math.min(1, p));
      const c = g.map((v, i) => Math.round(v + (r[i] - v) * t));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    /* ---------- latest release resolved at runtime (includePrerelease => newest, even pre-release) ---------- */
    const directApkCache = {};   // cacheKey -> resolved direct download URL

    const VERSION_CACHE_TTL = 10 * 60 * 1000;

    function stripV(version) {
      return String(version || "").replace(/^v/i, "").replace(/^([0-9][0-9A-Za-z.\-]*)[\s\S]*$/, "$1").trim();
    }

    async function fetchJson(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    }

    function normalizeReleaseVersion(raw) {
      const value = String(raw || "").trim();
      const match = value.match(/(?:^|[-_])v?(\d+(?:\.\d+){1,3}(?:[-+][0-9A-Za-z.-]+)?)/i);
      return match ? match[1] : stripV(value);
    }

    function releaseTag(release) {
      return String((release && release.tag_name) || "").trim();
    }

    // every number in a tag, so "android-v4.0.0", "v5.9.2" and "2.4.0-P72" sort sanely
    function versionScore(tag) {
      const parts = String(tag || "").match(/\d+/g);
      return parts ? parts.map(n => Number(n)) : [];
    }

    function compareVersions(a, b) {
      const left = versionScore(a);
      const right = versionScore(b);
      const len = Math.max(left.length, right.length);
      for (let i = 0; i < len; i++) {
        const x = left[i] || 0;
        const y = right[i] || 0;
        if (x !== y) return x - y;
      }
      return 0;
    }

    // one request per repo per page visit; releases are cached for a few minutes
    async function loadReleases(repo) {
      const cached = releaseCache[repo];
      if (cached && Date.now() - cached.at < VERSION_CACHE_TTL) return cached.list;
      const list = await fetchJson(`https://api.github.com/repos/${repo}/releases?per_page=30`);
      const safe = (Array.isArray(list) ? list : [])
        .filter(r => r && !r.draft && Array.isArray(r.assets));
      releaseCache[repo] = { list: safe, at: Date.now() };
      return safe;
    }

    // newest published release (pre-releases included on purpose: "latest even if unstable")
    async function resolveLatestVersion(repo) {
      const list = await loadReleases(repo);
      const sorted = list.slice().sort((a, b) => compareVersions(releaseTag(b), releaseTag(a)));
      const first = sorted[0];
      if (!first) return null;
      return { ver: normalizeReleaseVersion(first.tag_name), tag: releaseTag(first) };
    }

    function isInstallerAsset(name, kind) {
      const file = String(name || "");
      if (!file || /\.(sig|asc|sha256|sha256sums|txt|blockmap|yml|yaml|json|aab)$/i.test(file)) return false;
      if (kind === "apk") return /\.apk$/i.test(file);
      return /\.(exe|msi)$/i.test(file);
    }

    // universal builds install on every phone; desktops prefer a setup installer for x64
    function assetScore(name, kind) {
      const file = String(name || "").toLowerCase();
      let score = 0;
      if (kind === "apk") {
        if (/universal/.test(file)) score += 60;
        else if (/arm64|aarch64/.test(file)) score += 50;
        else if (/armeabi|armv7/.test(file)) score += 40;
        else if (/x86_64|x64/.test(file)) score += 30;
        else if (/x86/.test(file)) score += 20;
        if (/fdroid/.test(file)) score += 2;
        if (/beta|alpha|nightly/.test(file)) score -= 15;
      } else {
        if (/setup|install/.test(file)) score += 50;
        if (/x64|x86_64|amd64/.test(file)) score += 20;
        if (/\.msi$/.test(file)) score += 10;
        if (/portable/.test(file)) score -= 20;
        if (/arm64|aarch64/.test(file)) score -= 30;
      }
      return score;
    }

    function preferredApkArch() {
      const ua = (navigator.userAgent || "").toLowerCase();
      if (/\bx86\b|x86_64|i[3-6]86/.test(ua) && !/arm/.test(ua)) return "x86_64";
      return "arm64-v8a";
    }

    // pick the real file of the newest release that actually ships this platform's installer
    async function getDirectApkUrl(app, target) {
      const cfg = app.directApk;
      if (!cfg) return null;
      const repo = (target && typeof target === "object" && target.repo) || cfg.repo;
      const kind = (target && typeof target === "object") || typeof target === "function" ? "desktop" : "apk";
      const cacheKey = repo + ":" + kind;
      if (directApkCache[cacheKey]) return directApkCache[cacheKey];
      if (directApkPromises[cacheKey]) return directApkPromises[cacheKey];

      directApkPromises[cacheKey] = (async () => {
        try {
          const list = await loadReleases(repo);
          const usable = list
            .map(release => {
              const assets = release.assets
                .filter(asset => isInstallerAsset(asset.name, kind))
                .sort((a, b) => assetScore(b.name, kind) - assetScore(a.name, kind));
              return assets.length ? { release, asset: assets[0] } : null;
            })
            .filter(Boolean)
            .sort((a, b) => compareVersions(releaseTag(b.release), releaseTag(a.release)));
          if (usable.length) {
            const best = usable[0];
            return best.asset.browser_download_url ||
              `https://github.com/${repo}/releases/download/${releaseTag(best.release)}/${best.asset.name}`;
          }
        } catch (e) { /* offline or rate-limited: fall through to the releases page */ }
        return `https://github.com/${repo}/releases`;
      })();

      const result = await directApkPromises[cacheKey];
      if (result.indexOf("/releases/download/") !== -1) directApkCache[cacheKey] = result;
      delete directApkPromises[cacheKey];
      return result;
    }

    function openDirectApk(app, target) {
      const cfg = app.directApk;
      if (!cfg) return;
      const repo = (target && typeof target === "object" && target.repo) || cfg.repo;
      getDirectApkUrl(app, target)
        .then(url => window.open(url, "_blank", "noopener"))
        .catch(() => window.open(`https://github.com/${repo}/releases`, "_blank", "noopener"));
    }

    // warm the links in the background so the first click never waits
    setTimeout(() => {
      const platform = detectOS();
      APPS.filter(a => a.directApk).forEach(a => {
        getDirectApkUrl(a).catch(() => {});
        const target = platform && a.platforms ? a.platforms[platform] : null;
        if (target && typeof target === "object") getDirectApkUrl(a, target).catch(() => {});
      });
    }, 1200);

    function startDownload(appId, platform) {
      const app = APPS.find(a => a.id === appId);
      if (!app) return;

      if (app.directApk && platform === "android") {
        openDirectApk(app);
        return;
      }

      const target = app.platforms[platform];

      if (target && typeof target === "object" && app.directApk) {
        openDirectApk(app, target);
        return;
      }

      if (typeof target === "string" && target) window.open(target, "_blank", "noopener");
    }

    applyTheme(true);
    applyLang();
    setInterval(updateAll, 1000);
  </script>
</body>
</html>
