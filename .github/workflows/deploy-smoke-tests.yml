name: Deploy smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_url:
        description: "Optional deployed subscription-page URL to test"
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke-tests:
    name: Static and deployed smoke tests
    runs-on: ubuntu-latest
    env:
      DEPLOY_URL: ${{ inputs.deploy_url || vars.DEPLOY_URL || secrets.DEPLOY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer syntax
        shell: bash
        run: bash -n install.sh

      - name: Validate the `temp` command wiring
        shell: bash
        run: |
          grep -q 'TEMP_BIN_PATH' install.sh
          grep -q '/usr/local/bin/temp' install.sh
          grep -q 'TEMP_STATE_DIR' install.sh
          grep -q '^STATE_FILE=' install.sh
          grep -q 'install_command()' install.sh
          grep -q 'remember_page' install.sh
          grep -q '\* active' install.sh
          grep -q 'install_command$' install.sh

      - name: Functional test of the `temp` command (no root needed)
        shell: bash
        run: |
          set -euo pipefail
          # serve the checkout so the whole step tests the code in this commit
          # instead of whatever happens to be published on main
          py=python3
          "$py" -c 'import sys' >/dev/null 2>&1 || py=python
          "$py" -m http.server 8943 --bind 127.0.0.1 --directory . >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            curl -fsS -o /dev/null "http://127.0.0.1:8943/pages.txt" && break
            sleep 0.5
          done
          curl -fsS -o /dev/null "http://127.0.0.1:8943/pages.txt"

          work="$(mktemp -d)"
          export FAKE_ROOT=1
          export TEMP_TARGET_DIR="$work/theme"
          export TEMP_BIN_PATH="$work/bin/temp"
          export TEMP_STATE_DIR="$work/state"
          export TEMP_BASE_RAW="http://127.0.0.1:8943"
          export TEMP_LAUNCHER_URL="http://127.0.0.1:8943/install.sh"

          # first run through the one-liner: theme installed, state recorded,
          # and the `temp` command created
          bash install.sh modern
          test -s "$TEMP_TARGET_DIR/index.html"
          grep -q 'id="pingBtn"' "$TEMP_TARGET_DIR/index.html"
          test -x "$TEMP_BIN_PATH"
          test "$(cat "$TEMP_STATE_DIR/active")" = modern
          test -z "$(find "$work/theme" -name '*.bak.*' -print -quit)"

          # the menu shows which theme is active, and the direct form works
          printf '1\n' | bash install.sh > "$work/menu.log" 2>&1
          grep -q '\* active' "$work/menu.log"
          bash install.sh speed
          grep -q 'id="timeGauge"' "$TEMP_TARGET_DIR/index.html"
          test -n "$(find "$work/theme" -name '*.bak.*' -print -quit)"

          # `temp list` goes through the generated command
          bash "$TEMP_BIN_PATH" list > "$work/list.log"
          grep -qx 'modern' "$work/list.log"
          grep -qx 'speed' "$work/list.log"

          # `temp speed` switches the theme, and the offline cache keeps it working
          TEMP_LAUNCHER_URL="https://127.0.0.1:9/install.sh" bash "$TEMP_BIN_PATH" modern \
            > "$work/offline.log" 2>&1
          grep -q 'cached installer' "$work/offline.log"
          grep -q 'id="pingBtn"' "$TEMP_TARGET_DIR/index.html"
          test "$(cat "$TEMP_STATE_DIR/active")" = modern

      - name: Validate theme screenshots
        shell: bash
        run: |
          set -euo pipefail
          # every theme in pages.txt must ship a real PNG plus the cropped
          # version the README shows, and the README must link both
          while read -r theme; do
            theme="${theme%$'\r'}"   # pages.txt may carry CRLF line endings
            [ -n "$theme" ] || continue
            full="screenshots/$theme.png"
            top="screenshots/$theme-top.png"
            test -s "$full"
            test -s "$top"
            head -c 8 "$full" | od -An -tx1 | tr -d " \n" | grep -q "^89504e470d0a1a0a$"
            head -c 8 "$top"  | od -An -tx1 | tr -d " \n" | grep -q "^89504e470d0a1a0a$"
            grep -q "($full)" README.md
            grep -q "($top)" README.md
          done < pages.txt

      - name: Validate page JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          themes = [line.strip() for line in Path("pages.txt").read_text(encoding="utf-8").splitlines()]
          for name in [theme for theme in themes if theme]:
              source = Path(f"pages/{name}/index.html").read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", source, re.S)
              if len(scripts) != 1:
                  raise SystemExit(f"{name}: expected one inline script, found {len(scripts)}")
              rendered = re.sub(r"\{\{[^}]*\}\}", "0", scripts[0])
              Path(f"/tmp/{name}-rendered.js").write_text(rendered, encoding="utf-8")
          PY
          node --check /tmp/modern-rendered.js
          node --check /tmp/speed-rendered.js
          node --check /tmp/electronics-rendered.js

      - name: Validate required page features
        shell: bash
        run: |
          test -s pages/modern/index.html
          grep -q 'id="pingBtn"' pages/modern/index.html
          grep -q 'id="configQRModal"' pages/modern/index.html
          grep -q 'id="importAppSelect"' pages/modern/index.html
          grep -q 'function importConfigToApp' pages/modern/index.html
          grep -q 'function toggleConfigQR' pages/modern/index.html
          grep -q 'function runPingTest' pages/modern/index.html
          grep -q 'api.github.com/repos/' pages/modern/index.html
          # ZedSecure: newest-release APK per ABI, desktop installers, and the
          # deep-link that adds the subscription straight from the import box.
          grep -q 'CluvexStudio/ZedSecure' pages/modern/index.html
          grep -q 'ZedSecure-${ver}-${arch}.apk' pages/modern/index.html
          grep -q 'zedsecure://install-sub?url=' pages/modern/index.html
          grep -q 'id: "zedsecure"' pages/modern/index.html

      - name: Validate speed page features
        shell: bash
        run: |
          test -s pages/speed/index.html
          grep -q 'id="timeGauge"' pages/speed/index.html
          grep -q 'id="usageGauge"' pages/speed/index.html
          grep -q 'id="usageRemained"' pages/speed/index.html
          grep -q 'data-i18n="remainingShort"' pages/speed/index.html
          grep -q 'TIME_SCALE_SEC' pages/speed/index.html
          grep -q 'id="clockDigital"' pages/speed/index.html
          grep -q 'id="configQRModal"' pages/speed/index.html
          grep -q 'id="osSelect"' pages/speed/index.html
          grep -q 'data-platform="android"' pages/speed/index.html
          grep -q 'function detectOS' pages/speed/index.html
          grep -q 'function toggleConfigQR' pages/speed/index.html
          grep -q 'function startDownload' pages/speed/index.html
          grep -q 'api.github.com/repos/' pages/speed/index.html
          # ZedSecure: newest-release APK per ABI plus the Windows installer.
          grep -q 'CluvexStudio/ZedSecure' pages/speed/index.html
          grep -q 'ZedSecure-${ver}-${arch}.apk' pages/speed/index.html
          grep -q 'id: "zedsecure"' pages/speed/index.html
          ! grep -q 'importAppSelect' pages/speed/index.html
          # the speed theme deliberately ships without the latency test
          ! grep -q -e 'runPingTest' -e 'ping-result' -e 'pingBtn' pages/speed/index.html
          # day mode + Persian are the defaults
          grep -q 'class="day-mode"' pages/speed/index.html
          grep -q 'applyTheme(true)' pages/speed/index.html

      - name: Validate electronics page features
        shell: bash
        run: |
          test -s pages/electronics/index.html
          # seven-segment desk clock with the Iranian calendar + occasion
          grep -q 'id="segClock"' pages/electronics/index.html
          grep -q 'function toJalali' pages/electronics/index.html
          grep -q 'JALALI_EVENTS' pages/electronics/index.html
          grep -q 'id="clockDate"' pages/electronics/index.html
          grep -q 'id="clockEvent"' pages/electronics/index.html
          # the two multimeter dials always sit side by side
          grep -q 'id="timeGauge"' pages/electronics/index.html
          grep -q 'id="usageGauge"' pages/electronics/index.html
          grep -q 'id="usageRemained"' pages/electronics/index.html
          grep -q 'data-i18n="remainingShort"' pages/electronics/index.html
          grep -q 'class="meter-remained-value"' pages/electronics/index.html
          grep -q 'remained-blink' pages/electronics/index.html
          # the time dial is printed 0-30 days and waits at full above that
          grep -q 'TIME_SCALE_SEC = 30 \* 24 \* 60 \* 60' pages/electronics/index.html
          grep -q 'Math.min(1, secLeft / TIME_SCALE_SEC)' pages/electronics/index.html
          # hourly / daily / weekly usage charts under the dials
          grep -q 'id="chartHourly"' pages/electronics/index.html
          grep -q 'id="chartDaily"' pages/electronics/index.html
          grep -q 'id="chartWeekly"' pages/electronics/index.html
          grep -q 'function bucketUsage' pages/electronics/index.html
          # renewal warnings under one day / under one gigabyte
          grep -q 'id="alertTime"' pages/electronics/index.html
          grep -q 'id="alertVol"' pages/electronics/index.html
          grep -q 'ONE_GB_BYTES' pages/electronics/index.html
          # subscription link, per-config QR + copy, copy-all, OS detection
          grep -q 'id="configQRModal"' pages/electronics/index.html
          grep -q 'id="osSelect"' pages/electronics/index.html
          grep -q 'data-platform="android"' pages/electronics/index.html
          grep -q 'function toggleConfigQR' pages/electronics/index.html
          grep -q 'function startDownload' pages/electronics/index.html
          grep -q 'function copyAllConfigs' pages/electronics/index.html
          grep -q 'api.github.com/repos/' pages/electronics/index.html
          # ZedSecure: newest-release APK per ABI plus the Windows installer
          grep -q 'CluvexStudio/ZedSecure' pages/electronics/index.html
          grep -q 'ZedSecure-${ver}-${arch}.apk' pages/electronics/index.html
          grep -q 'id: "zedsecure"' pages/electronics/index.html
          # day mode (red bench theme) + Persian are the defaults
          grep -q 'class="day-mode"' pages/electronics/index.html
          grep -q 'applyTheme(true)' pages/electronics/index.html

      - name: Run deployed-page smoke tests
        if: ${{ env.DEPLOY_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          url="${DEPLOY_URL}"
          case "$url" in
            http://*|https://*) ;;
            *) echo "DEPLOY_URL must start with http:// or https://" >&2; exit 1 ;;
          esac
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --fail-with-body --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -o "$body" -w '%{http_code}' "$url")"
          test "$status" = 200
          grep -q 'id="pingBtn"' "$body"
          grep -q 'id="configQRModal"' "$body"
          grep -q 'id="importAppSelect"' "$body"
          echo "Deployed smoke tests passed with HTTP $status"

      - name: Report skipped deployment check
        if: ${{ env.DEPLOY_URL == '' }}
        run: echo "DEPLOY_URL is not configured; static smoke tests passed and deployed check was skipped."
